# The vendor device family packs that scripts/check_against_packs.py compares the target specs
# with, pinned by version. scripts/fetch_packs.py downloads them into packs/, which Git ignores.
#
# Names, versions and addresses are from the public CMSIS pack index
# (https://www.keil.com/pack/index.pidx), read on 2026-11-27. A pack's file is
# <url><vendor>.<name>.<version>.pack.
#
# `sha256` pins the file. An entry without one is downloaded and its hash is printed, so that it
# can be pinned here after the first run.
#
# A pack is a cross-check, never a source: see docs/CATALOGUE_CHECK.md.

[[pack]]
vendor = "AmbiqMicro"
name = "Apollo_DFP"
version = "1.6.0"
url = "https://download.ambiq.com/packs/"
specs = ["apollo3-blue"]

