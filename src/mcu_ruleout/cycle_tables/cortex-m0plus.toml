# Minimum cycle counts for the Cortex-M0+, transcribed from Arm's table. Numbers only.
# Rule used by the model: the lowest count the table allows for the instruction, whatever
# its neighbours are. The only context taken from the trace is whether a conditional branch
# was taken. The table itself assumes zero wait states.
schema = 1
core = "cortex-m0plus"
table_version = "1"

[sources.trm]
title = "Cortex-M0+ Technical Reference Manual"
revision = "r0p1 (ARM DDI 0484C), marked Latest"
where = "Programmers Model > Instruction set summary, Table 3.1 and its footnotes a-h"
url = "https://developer.arm.com/documentation/ddi0484/c/Programmers-Model/Instruction-set-summary"
accessed = 2026-11-24

# Each class: fixed `cycles`, or `base` + `per_reg` * N, or `taken` / `not_taken`.
# `names` are Capstone base mnemonics; classes without names are chosen by operands in code.

[classes.dp]
cycles = 1
row = "Move, Add, Subtract, Compare, Logical, Shift, Rotate, Extend, Reverse rows: 1"
names = ["mov", "add", "adc", "adr", "sub", "sbc", "rsb", "neg", "cmp", "cmn", "and", "eor", "orr", "bic",
         "mvn", "tst", "lsl", "lsr", "asr", "ror", "sxth", "sxtb", "uxth", "uxtb", "rev", "rev16", "revsh"]

[classes.dp_pc]
cycles = 2
row = "MOV PC, Rm: 2; ADD PC, PC, Rm: 2"

[classes.mul]
cycles = 1
row = "MULS: 1 or 32 (footnote a: depends on multiplier implementation); minimum taken"
names = ["mul"]

[classes.load]
cycles = 2
row = "LDR/LDRH/LDRB/LDRSH/LDRSB, all forms: 2 or 1 (footnote b: 1 only to the single-cycle I/O port)"
note = "2 is used because the emulated memory map has no single-cycle I/O port; an access to one would fault."
names = ["ldr", "ldrh", "ldrb", "ldrsh", "ldrsb"]

[classes.store]
cycles = 2
row = "STR/STRH/STRB, all forms: 2 or 1 (footnote b)"
note = "Same reasoning as load."
names = ["str", "strh", "strb"]

[classes.multi]
base = 1
per_reg = 1
row = "LDM, STM, PUSH, POP: 1+N (footnotes c, d: N = number of registers, including LR)"
names = ["ldm", "stm", "push", "pop"]

[classes.multi_pc]
base = 3
per_reg = 1
row = "POP {<loreglist>, PC}: 3+N (footnote d: N includes PC)"

[classes.bcc]
taken = 2
not_taken = 1
row = "B<cc>: 1 or 2 (footnote e: 2 if taken, 1 if not taken)"

[classes.b]
cycles = 2
row = "B <label>: 2"
names = ["b"]

[classes.bl]
cycles = 3
row = "BL <label>: 3"
names = ["bl"]

[classes.bx]
cycles = 2
row = "BX Rm: 2; BLX Rm: 2"
names = ["bx", "blx"]

[classes.cps]
cycles = 1
row = "CPSID i / CPSIE i: 1"
names = ["cps"]

[classes.special_reg]
cycles = 3
row = "MRS: 3; MSR: 3"
names = ["mrs", "msr"]

[classes.hint]
cycles = 1
row = "SEV: 1; YIELD: 1 (footnote h: executes as NOP); NOP: 1"
names = ["nop", "sev", "yield"]

[classes.barrier]
cycles = 3
row = "ISB: 3; DMB: 3; DSB: 3"
names = ["isb", "dmb", "dsb"]

[classes.unsupported]
row = "SVC, BKPT: no count given (footnote f); WFE, WFI: exclude waiting time (footnote g)"
names = ["svc", "bkpt", "wfe", "wfi", "udf"]
