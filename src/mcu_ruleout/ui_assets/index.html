<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mcu-ruleout</title>
<style>
  :root {
    --bg: #ffffff; --ink: #111418; --muted: #5d6570; --line: #d9dde3; --field: #f6f7f9;
    --accent: #0b6e4f; --accent-ink: #ffffff; --out: #c62828; --out-bg: #fdecec; --bar: #8a96a6; --track: #e9ecf0;
    --warn: #9a6700; --warn-bg: #fff6dc;
    --sans: Bahnschrift, "DIN Alternate", "Avenir Next", "Trebuchet MS", "Helvetica Neue", Arial, sans-serif;
    --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, "DejaVu Sans Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101215; --ink: #e8eaed; --muted: #9aa3ae; --line: #2c3138; --field: #181b1f;
      --accent: #4fc79f; --accent-ink: #07130f; --out: #ff8a80; --out-bg: #331a1a; --bar: #6f7b8b; --track: #252a31;
      --warn: #e3b341; --warn-bg: #2b2412;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
  main { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: .01em; }
  .lede { margin: 4px 0 28px; color: var(--muted); }
  label { display: block; margin: 18px 0 6px; font-weight: 600; }
  label small, .hint { font-weight: 400; color: var(--muted); font-size: 14px; }
  .hint { margin: 6px 0 0; }
  input, select, textarea, button { font: inherit; color: inherit; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); }
  input.code { font: 13.5px/1.5 var(--mono); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .two { grid-template-columns: 1fr; gap: 0; } }
  .inline { display: flex; gap: 8px; }
  .inline > :first-child { flex: 1; min-width: 0; }
  .inline select { width: auto; }
  button { border: 1px solid var(--line); border-radius: 4px; background: transparent; padding: 6px 12px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--ink); }
  button:disabled { opacity: .5; cursor: default; }
  button.link { border: 0; padding: 0; color: var(--accent); text-decoration: underline; }
  #run { width: 100%; margin-top: 26px; padding: 12px; border-color: var(--accent); background: var(--accent);
         color: var(--accent-ink); font-weight: 600; font-size: 17px; }
  #status { min-height: 1.5em; margin: 10px 0 0; color: var(--muted); font-size: 14px; }
  details.more { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
  summary { cursor: pointer; font-weight: 600; }
  .drop { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 18px; border: 1.5px dashed var(--line);
          border-radius: 4px; background: var(--field); color: var(--muted); }
  .drop.over { border-color: var(--accent); }
  .drop #pick { background: var(--bg); color: var(--ink); }
  .files { list-style: none; margin: 8px 0 0; padding: 0; color: var(--ink); font-size: 15px; }
  .files li { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .files .name { font: 13.5px var(--mono); flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .files .size { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .files button { padding: 1px 8px; }

  #results { margin-top: 36px; display: grid; gap: 28px; }
  .result { border-top: 2px solid var(--ink); padding-top: 14px; }
  .result h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .verdict { margin: 6px 0 2px; font-size: 22px; font-weight: 600; line-height: 1.25; }
  .verdict.out { color: var(--out); }
  .why { margin: 0 0 14px; color: var(--muted); }
  .line { display: flex; justify-content: space-between; gap: 16px; margin-top: 12px; }
  .line span:last-child { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .track { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .fill { height: 100%; background: var(--bar); min-width: 2px; }
  .fill.over { background: var(--out); }
  .result details { margin-top: 16px; }
  .result summary { font-weight: 400; color: var(--accent); }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 10px 0 4px; }
  th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  th { font-weight: 600; color: var(--muted); }
  h3 { margin: 18px 0 4px; font-size: 14px; font-weight: 600; }
  ul { margin: 4px 0; padding-left: 20px; font-size: 14.5px; color: var(--muted); }
  .small { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; margin: 12px 0 0; }
  .caution { margin: 10px 0 0; padding: 10px 12px; border-left: 3px solid var(--warn); background: var(--warn-bg); font-size: 14.5px; }
  .tally { display: flex; flex-wrap: wrap; gap: 6px 28px; margin: 8px 0 14px; }
  .tally div { font-size: 14px; color: var(--muted); }
  .tally b { display: block; font-size: 26px; font-weight: 600; color: var(--ink); line-height: 1.2; font-variant-numeric: tabular-nums; }
  .tally .out b { color: var(--out); }
  td.status, .shortlist th:nth-child(2) { text-align: left; }
  tr.out td.status { color: var(--out); font-weight: 600; }
  td .link { font-family: var(--mono); font-size: 13.5px; }
  pre.err { background: var(--out-bg); color: var(--out); padding: 12px; border-radius: 4px; white-space: pre-wrap;
            overflow-wrap: anywhere; font: 13px/1.5 var(--mono); margin: 10px 0 0; }
</style>
</head>
<body>
<main>
  <h1>mcu-ruleout</h1>
  <p class="lede">Finds the microcontrollers your code cannot run on. It never says that code fits.</p>

  <label for="target">Target</label>
  <select id="target"></select>
  <p class="hint" id="target-info"></p>

  <label for="pick">Code files</label>
  <div class="drop" id="drop">
    <input type="file" id="file-input" multiple accept=".c,.h,.cc,.cpp,.hpp,.S,.s" hidden>
    <button id="pick" type="button">Choose files</button>
    <span>or drop them here</span>
  </div>
  <ul class="files" id="files" aria-label="Chosen files"></ul>
  <p class="hint">C, C++ or assembly sources and their headers (.c .cpp .cc .S .h .hpp).</p>
  <div class="inline" style="margin-top:10px">
    <select id="example" aria-label="Load an example"><option value="">No code yet? Load an example…</option></select>
  </div>

  <div class="two">
    <div>
      <label for="entry">Function to run</label>
      <input type="text" class="code" id="entry" spellcheck="false" placeholder="bench_fir">
    </div>
    <div>
      <label for="deadline">Deadline <small>optional</small></label>
      <div class="inline">
        <input type="number" id="deadline" min="0" step="any" placeholder="none">
        <select id="deadline-unit" aria-label="Deadline unit">
          <option value="us">µs</option><option value="ms">ms</option><option value="s">s</option><option value="ns">ns</option>
        </select>
      </div>
    </div>
  </div>
  <p class="hint">The function takes no arguments and sets up its own data.</p>

  <details class="more">
    <summary>More options</summary>
    <label for="measure">Time only this function <small>leaves setup code out</small></label>
    <input type="text" class="code" id="measure" spellcheck="false" placeholder="same as the function to run">
    <label for="cflags">Compiler flags</label>
    <input type="text" class="code" id="cflags" spellcheck="false" value="-O2">
    <label for="defines">Defines</label>
    <input type="text" class="code" id="defines" spellcheck="false" placeholder="NAME=value OTHER">
  </details>

  <button id="run" type="button">Run checks</button>
  <p id="status" role="status" aria-live="polite"></p>

  <div id="results" aria-live="polite"></div>
</main>
<script>
"use strict";
const token = new URLSearchParams(location.search).get("token") || "";
const $ = (id) => document.getElementById(id);

function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") node.className = v; else if (k === "style") node.style.cssText = v; else node.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined) node.append(kid);
  return node;
}

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: { "X-Token": token, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  let data;
  try { data = await res.json(); } catch { data = { error: "The server sent an unreadable reply (HTTP " + res.status + ")." }; }
  if (!res.ok) throw new Error(data.error || "HTTP " + res.status);
  return data;
}

const num = (n) => Number(n).toLocaleString("en-US");
const scaled = (n, unit) => `${n.toLocaleString("en-US", { maximumFractionDigits: 1 })} ${unit}`;
const bytes = (n) => n >= 1048576 ? scaled(n / 1048576, "MB")
  : n >= 10240 || (n >= 1024 && n % 1024 === 0) ? scaled(n / 1024, "kB") : `${num(n)} B`;
function dur(s) {
  const f = (v, unit) => v.toLocaleString("en-US", { maximumFractionDigits: 3 }) + " " + unit;
  return s < 1e-6 ? f(s * 1e9, "ns") : s < 1e-3 ? f(s * 1e6, "µs") : s < 1 ? f(s * 1e3, "ms") : f(s, "s");
}

// ---- files: chosen or dropped, read in the browser, sent as text ----
const ALLOWED = [".c", ".h", ".cc", ".cpp", ".hpp", ".S", ".s"];
const MAX_FILES = 16, MAX_TOTAL = 900000;  // the server accepts about 1 MB per request
let files = [];  // { name, content }
const sizeOf = (f) => new Blob([f.content]).size;
function showFiles() {
  $("files").replaceChildren(...files.map((f, i) => {
    const remove = el("button", { type: "button", "aria-label": `Remove ${f.name}` }, "×");
    remove.addEventListener("click", () => { files.splice(i, 1); showFiles(); });
    return el("li", {}, el("span", { class: "name" }, f.name), el("span", { class: "size" }, bytes(sizeOf(f))), remove);
  }));
}
async function addFiles(list) {
  const skipped = [];
  for (const file of list) {
    if (!ALLOWED.some((ext) => file.name.endsWith(ext))) { skipped.push(`${file.name} (not a source or header file)`); continue; }
    const content = await file.text();
    const others = files.filter((f) => f.name !== file.name);  // a file with the same name is replaced
    if (others.length >= MAX_FILES) { skipped.push(`${file.name} (at most ${MAX_FILES} files)`); continue; }
    if (others.reduce((n, f) => n + sizeOf(f), 0) + file.size > MAX_TOTAL) { skipped.push(`${file.name} (total size over the limit)`); continue; }
    files = [...others, { name: file.name, content }];
  }
  showFiles();
  setStatus(skipped.length ? "Skipped: " + skipped.join(", ") + "." : "");
}
$("pick").addEventListener("click", () => $("file-input").click());
$("file-input").addEventListener("change", async (e) => { await addFiles(e.target.files); e.target.value = ""; });
const drop = $("drop");
for (const type of ["dragenter", "dragover"]) drop.addEventListener(type, (e) => { e.preventDefault(); drop.classList.add("over"); });
for (const type of ["dragleave", "drop"]) drop.addEventListener(type, (e) => { e.preventDefault(); drop.classList.remove("over"); });
drop.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));
$("example").addEventListener("change", async () => {
  const name = $("example").value;
  if (!name) return;
  try {
    const ex = await api("/api/example?name=" + encodeURIComponent(name));
    files = ex.files; showFiles();
    $("entry").value = ex.entry; $("measure").value = ex.measure; $("cflags").value = ex.cflags;
    $("deadline").value = ex.deadline; $("deadline-unit").value = ex.deadline_unit; $("defines").value = "";
    const sizes = Object.entries(ex.sizes).map(([k, v]) => `${k}=${v}`).join(" ");
    setStatus("Example loaded." + (sizes ? ` Change its size under More options, Defines (defaults: ${sizes}).` : ""));
  } catch (e) { setStatus(e.message); }
  $("example").value = "";
});

// ---- target ----
const ALL = "*";
let targets = [];
function showTarget() {
  const t = targets.find((x) => x.id === $("target").value);
  $("target-info").textContent = t
    ? `${bytes(t.flash_bytes)} flash · ${bytes(t.ram_bytes)} RAM · ${t.max_clock_hz / 1e6} MHz · ${t.core}`
    : `Checks every built-in target and strikes out the ones that cannot work.`;
}
$("target").addEventListener("change", showTarget);

// ---- run: a shortlist over all targets, or both checks on one ----
function setStatus(text) { $("status").textContent = text; }
function request() {
  return {
    target: $("target").value, files, entry: $("entry").value, measure: $("measure").value,
    cflags: $("cflags").value, defines: $("defines").value,
    deadline: $("deadline").value, deadline_unit: $("deadline-unit").value,
  };
}
async function run() {
  if (!files.length) { setStatus("Choose at least one code file first."); return; }
  if (!$("entry").value.trim()) { setStatus("Enter the name of the function to run."); $("entry").focus(); return; }
  const body = request();
  $("run").disabled = true;
  $("results").replaceChildren();
  const started = performance.now();
  const steps = body.target === ALL
    ? [["shortlist", `Checking ${targets.length} targets…`, "Shortlist", shortlistResult]]
    : [["memory", "Checking memory…", "Memory", memoryResult], ["timing", "Checking timing…", "Timing", timingResult]];
  for (const [kind, busy, title, render] of steps) {
    setStatus(busy);
    let block;
    try { block = render(await api("/api/" + kind, body)); }
    catch (e) { block = errorResult(title, e.message); }
    $("results").append(block);
  }
  setStatus(`Done in ${((performance.now() - started) / 1000).toFixed(1)} s.`);
  $("run").disabled = false;
  $("results").scrollIntoView({ behavior: "smooth", block: "start" });
}
$("run").addEventListener("click", run);

// ---- results ----
function bar(label, need, cap, fmt) {
  const pct = cap > 0 ? Math.min(100, (need / cap) * 100) : 100;
  return [
    el("div", { class: "line" }, el("span", {}, label), el("span", {}, `${fmt(need)} of ${fmt(cap)}`)),
    el("div", { class: "track" }, el("div", { class: "fill" + (need > cap ? " over" : ""), style: `width:${pct}%` })),
  ];
}
function table(head, rows) {
  return el("div", { class: "scroll" }, el("table", {},
    el("thead", {}, el("tr", {}, head.map((h) => el("th", {}, h)))),
    el("tbody", {}, rows.map((r) => el("tr", {}, r.map((c) => el("td", {}, String(c))))))));
}
function result(title, d, why, summary, details) {
  return el("section", { class: "result" },
    el("h2", {}, title),
    el("p", { class: "verdict" + (d.ruled_out ? " out" : "") }, d.ruled_out ? "Ruled out" : "Not ruled out — measure on hardware"),
    el("p", { class: "why" }, why),
    ...(d.cautions || []).map((c) => el("p", { class: "caution" }, c)),
    ...summary,
    el("details", {}, el("summary", {}, "Details"), ...details,
      el("h3", {}, "Assumptions"), el("ul", {}, d.assumptions.map((a) => el("li", {}, a))),
      el("h3", {}, "Not modelled"), el("ul", {}, d.not_modeled.map((a) => el("li", {}, a))),
      el("p", { class: "small" }, Object.entries(d.versions).map(([k, v]) => `${k} ${v}`).join(" · ") +
        (d.cycle_table ? " · " + d.cycle_table : ""))));
}

function memoryResult(d) {
  const lb = d.lower_bounds, t = d.target;
  const builds = d.measurements.map((m) => m.ok
    ? [m.label, num(m.flash_bytes), num(m.ram_static_bytes), num(m.stack_frame_lb_bytes ?? 0)]
    : [m.label, "build failed", "", ""]);
  const cg = d.measurements.map((m) => m.worst_case_stack_info).find(Boolean);
  const why = d.ruled_out
    ? "Even the smallest build needs more than the target has: " + d.reasons.join("; ") + "."
    : "No proof of failure was found. This does not show that the code fits.";
  return result("Memory", d, why,
    [...bar("Flash needed, at least", lb.flash_bytes, t.flash_capacity_bytes, bytes),
     ...bar("RAM needed, at least", lb.ram_bytes, t.ram_capacity_bytes, bytes)],
    [lb.your_code_flash_bytes !== null && lb.your_code_flash_bytes !== undefined
       ? el("p", { class: "small" }, `Of that, your own code is at least ${bytes(lb.your_code_flash_bytes)} of flash and ` +
           `${bytes(lb.your_code_ram_bytes)} of RAM. The rest is the toolchain's runtime library and padding.`) : null,
     el("h3", {}, "Builds compared (bytes)"), table(["build", "flash", "static RAM", "stack frame"], builds),
     cg ? el("p", { class: "small" }, `Worst-case stack from the call graph, for information only: ${num(cg.known_bytes)} B` +
       (cg.complete ? "." : ` plus unknown (${cg.unknowns.join("; ")}).`)) : null]);
}

function timingResult(d) {
  const has = d.deadline_s !== null && d.deadline_s !== undefined;
  const why = d.ruled_out
    ? `Even in the best case it takes ${dur(d.time_lower_bound_s)}, longer than the ${dur(d.deadline_s)} deadline.`
    : has ? "The best case is within the deadline. Real hardware can only be slower, so this proves nothing either way."
          : "No deadline was given, so nothing can be ruled out. Real hardware can only be slower than this.";
  const classes = Object.entries(d.by_class).sort((a, b) => b[1].cycles - a[1].cycles)
    .map(([k, v]) => [k, num(v.instructions), num(v.cycles)]);
  const zero = Object.entries(d.undocumented_counted_as_zero);
  const origins = Object.entries(d.cycles_by_origin || {}).sort((a, b) => b[1] - a[1]);
  const summary = has
    ? bar("Best-case time", d.time_lower_bound_s, d.deadline_s, dur)
    : [el("div", { class: "line" }, el("span", {}, "Best-case time"), el("span", {}, dur(d.time_lower_bound_s)))];
  return result("Timing", d, why, summary,
    [el("p", { class: "small" }, `${num(d.cycles_lower_bound)} cycles at ${d.clock_hz / 1e6} MHz, the target's highest rated clock. ` +
       `${num(d.instructions)} instructions executed in ${d.inputs.measure}. Valid for this exact build and input only.`),
     zero.length ? el("p", { class: "small" }, "Not in the cycle table, counted as 0: " + zero.map(([k, n]) => `${k} ×${num(n)}`).join(", ")) : null,
     d.builds.length > 1 ? el("h3", {}, "Builds compared (the fastest one counts)") : null,
     d.builds.length > 1 ? table(["build", "instructions", "cycles"], d.builds.map((b) => b.ok
       ? [b.label + (b.label === d.lower_bound_from ? "  ← fastest" : ""), num(b.instructions), num(b.cycles)]
       : [b.label, "not traced", ""])) : null,
     origins.length > 1 ? el("h3", {}, "Cycles by origin") : null,
     origins.length > 1 ? table(["origin", "cycles", "share"], origins.map(([k, v]) =>
       [k, num(v), (100 * v / d.cycles_lower_bound).toFixed(1) + " %"])) : null,
     el("h3", {}, "Cycles by instruction class"), table(["class", "instructions", "cycles"], classes)]);
}

function shortlistResult(d) {
  const c = d.counts, has = d.deadline_s !== null && d.deadline_s !== undefined;
  const rows = d.rows.map((r) => {
    const t = r.target, m = r.memory, tm = r.timing;
    const pick = el("button", { class: "link", type: "button", title: `Run both checks on ${t.id} alone` }, t.id);
    pick.addEventListener("click", () => { $("target").value = t.id; showTarget(); run(); });
    const status = r.ruled_out ? `Ruled out: ${r.ruled_out_by.join(", ")}${r.depends_on_library ? " *" : ""}`
      : (m || tm) ? "Not ruled out" : "No verdict";
    return el("tr", { class: r.ruled_out ? "out" : "" },
      el("td", {}, pick), el("td", { class: "status" }, status),
      el("td", {}, m ? `${bytes(m.lower_bounds.flash_bytes)} of ${bytes(t.flash_capacity_bytes)}` : "–"),
      el("td", {}, m ? `${bytes(m.lower_bounds.ram_bytes)} of ${bytes(t.ram_capacity_bytes)}` : "–"),
      el("td", {}, tm ? `${dur(tm.time_lower_bound_s)} at ${t.max_clock_hz / 1e6} MHz` : "–"));
  });
  const errors = d.rows.flatMap((r) => r.errors.map((e) => `${r.target.id}: ${e}`));
  const floors = d.floors.map((f) => el("li", {}, `${f.core}: ` + [
    f.flash_bytes !== null ? `flash ${bytes(f.flash_bytes)}, RAM ${bytes(f.ram_bytes)}` : null,
    f.cycles !== null ? `${num(f.cycles)} cycles` : null,
    f.required_clock_hz ? `so a clock above ${(f.required_clock_hz / 1e6).toLocaleString("en-US", { maximumFractionDigits: 1 })} MHz for the deadline` : null,
  ].filter(Boolean).join("; ")));
  return el("section", { class: "result" },
    el("h2", {}, "Shortlist"),
    el("div", { class: "tally" },
      el("div", { class: "out" }, el("b", {}, String(c.ruled_out)), "ruled out"),
      el("div", {}, el("b", {}, String(c.not_ruled_out)), "not ruled out"),
      c.no_verdict ? el("div", {}, el("b", {}, String(c.no_verdict)), "no verdict") : null),
    el("p", { class: "why" }, (c.not_ruled_out
      ? "The targets that are left are not shown to work. They could not be proven impossible, so measure on hardware."
      : "Every target that could be checked is ruled out.") +
      (has ? "" : " No deadline was given, so only memory can rule a target out.")),
    d.timing_skipped ? el("p", { class: "caution" }, "Timing was not checked: " + d.timing_skipped) : null,
    el("div", { class: "scroll" }, el("table", { class: "shortlist" },
      el("thead", {}, el("tr", {}, ["target", "verdict", "flash, at least", "RAM, at least", "best-case time"].map((h) => el("th", {}, h)))),
      el("tbody", {}, rows))),
    d.rows.some((r) => r.depends_on_library) ? el("p", { class: "small" },
      "* Depends on library code: the rule-out would not stand if the toolchain's runtime library routines were " +
      "replaced by faster or smaller ones. Select the target name for the details.") : null,
    errors.length ? el("pre", { class: "err" }, errors.join("\n")) : null,
    el("details", {}, el("summary", {}, "Details"),
      el("h3", {}, "Least that any part with the same core needs"), el("ul", {}, floors),
      el("h3", {}, "Assumptions"), el("ul", {}, [...d.assumptions.memory, ...d.assumptions.timing].map((a) => el("li", {}, a))),
      el("h3", {}, "Not modelled"), el("ul", {}, [...d.not_modeled.memory, ...d.not_modeled.timing].map((a) => el("li", {}, a))),
      el("p", { class: "small" }, Object.entries(d.versions).map(([k, v]) => `${k} ${v}`).join(" · "))));
}

function errorResult(title, message) {
  return el("section", { class: "result" }, el("h2", {}, title),
    el("p", { class: "verdict" }, "Could not run"), el("p", { class: "why" }, "No verdict was produced."),
    el("pre", { class: "err" }, message));
}

// ---- start ----
(async () => {
  showFiles();
  try {
    targets = await api("/api/targets");
    $("target").replaceChildren(el("option", { value: ALL }, `All ${targets.length} targets`),
      ...targets.map((t) => el("option", { value: t.id }, t.name)));
    showTarget();
    const examples = await api("/api/examples");
    $("example").append(...examples.map((x) => el("option", { value: x.name }, x.title)));
  } catch (e) { setStatus("Could not load targets: " + e.message); }
})();
</script>
</body>
</html>
