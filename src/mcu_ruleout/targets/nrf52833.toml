# Nordic nRF52833, chip level.
# Every hardware number cites the manufacturer's document. The PDF could not be fetched, so the
# citations name chapters, tables and figures of the HTML edition and carry no page numbers. The
# HTML edition numbers its figures per chapter, which may differ from the PDF.
schema = 1
id = "nrf52833"
name = "Nordic nRF52833 (512 kB flash, 128 kB RAM)"
core = "cortex-m4f"
# Tool choice, not a datasheet fact: fpv4-sp-d16 is GCC's name for the Cortex-M4 single-precision FPU.
gcc_flags = ["-mcpu=cortex-m4", "-mthumb", "-mfpu=fpv4-sp-d16", "-mfloat-abi=hard"]
provenance = "Extracted by an automated agent from the HTML edition on 2026-11-26. A second automated pass then re-read the Memory chapter text and the memory layout figure in a browser; the CPU chapter (FPU, 64 MHz) and the revision history were read once only. No page numbers: the PDF was not available. Not yet checked by a person."

notes = [
    "Used on the BBC micro:bit v2. That is general knowledge, not from the cited document; check your own board.",
    "The Code RAM region at 0x00800000 is the same physical RAM as the Data RAM at 0x20000000 (Memory chapter) and is not counted twice.",
    "A SoftDevice (Nordic's Bluetooth stack) would reserve part of flash and RAM. That is not subtracted, so capacity stays an upper bound.",
    "Running from flash at 64 MHz can need up to 2 wait states with the cache off (CPU chapter, CPU performance). The timing check assumes none.",
]

# Who last compared these numbers with the cited documents. A release needs by = "person".
[checked]
by = "agent"
date = 2026-11-26
method = "The Memory chapter text and the memory layout figure were re-read by a second automated pass in a browser (HTML edition, no page numbers). The CPU chapter and the revision history were read once only."

[sources.nrf52833-ps]
title = "nRF52833 Product Specification"
publisher = "Nordic Semiconductor"
revision = "v1.7, June 2024 (HTML edition; the revision history chapter lists this as the latest)"
url = "https://docs.nordicsemi.com/bundle/ps_nrf52833/"
accessed = 2026-11-26

[fpu]
value = "single-precision FPU"
source = "nrf52833-ps"
where = "chapter CPU, opening paragraph and feature list (single-precision floating-point unit)"

[max_clock_hz]
value = 64_000_000
source = "nrf52833-ps"
where = "chapter CPU, Electrical specification, CPU performance (the CPU clock speed is 64 MHz)"
note = "The only CPU clock the document gives."

[[flash]]
name = "on-chip flash"
base = 0x0000_0000
size = 524_288
source = "nrf52833-ps"
where = "chapter Memory, first sentence (512 kB of flash memory) and Flash - Non-volatile memory (128 pages of 4 kB); Figure 1 Memory layout (page 0 at 0x0000 0000)"

[[ram]]
name = "RAM0 to RAM7 (Data RAM view)"
base = 0x2000_0000
size = 65_536
source = "nrf52833-ps"
where = "chapter Memory, RAM - Random access memory (slaves 0 to 7: two 4 kB sections each); Figure 1 Memory layout (from 0x2000 0000)"

[[ram]]
name = "RAM8 (Data RAM view)"
base = 0x2001_0000
size = 65_536
source = "nrf52833-ps"
where = "chapter Memory, RAM - Random access memory (slave 8: two 32 kB sections); Figure 1 Memory layout (0x2001 0000 and 0x2001 8000)"
