name: Bug report
description: The tool crashed, printed something wrong, or misled you.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Please do not paste code you are not allowed to share. A result written with
        `--share result.json` holds the verdicts and versions without source text or file names.
        For a security problem, do not open an issue: see SECURITY.md.
  - type: textarea
    id: command
    attributes:
      label: The command you ran
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What it printed
      description: The error line, or the part of the report that is wrong.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and why
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `mcu-ruleout doctor`
      render: text
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem is it?
      options:
        - A crash or an error that should not happen
        - A number that looks wrong (a bound, a capacity, a clock)
        - A verdict that looks wrong
        - A message or a document that misled me
        - Something else
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: A small source file that shows the problem helps most, if you can share one.
