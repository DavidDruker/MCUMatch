name: release

# Publishes a tagged version to TestPyPI and then to PyPI with trusted publishing: GitHub proves
# its identity to PyPI through OIDC, so no token is stored anywhere.
#
# One-time setup, by the maintainer, before the first tag (this workflow has never run):
#   1. On test.pypi.org and on pypi.org, add a "pending publisher" for the project name
#      `mcu-ruleout`: this repository, workflow `release.yml`, environment `testpypi` or `pypi`.
#   2. In this repository's settings, create the environments `testpypi` and `pypi`. Give `pypi`
#      a required reviewer, so that a release to PyPI waits for a person.
#   3. Set the version in pyproject.toml and src/mcu_ruleout/__init__.py, update CHANGELOG.md,
#      commit, then tag: `git tag v0.2.0 && git push origin v0.2.0`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag must match the package version
        run: |
          python - <<'PY'
          import os, re, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          source = re.search(r'__version__ = "([^"]+)"', open("src/mcu_ruleout/__init__.py").read())[1]
          if not (tag == "v" + version == "v" + source):
              sys.exit(f"tag {tag}, pyproject.toml {version} and __init__.py {source} do not agree")
          if "dev" in version:
              sys.exit(f"{version} is a development version; set a release version before tagging")
          print("releasing", version)
          PY

      - name: Build the sdist and the wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
