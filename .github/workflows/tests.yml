name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Same compiler release as development (Arm GNU Toolchain 14.2.Rel1). Checksum from Arm's
  # published .sha256asc file for this archive.
  TOOLCHAIN_URL: https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz
  TOOLCHAIN_SHA256: 62a63b981fe391a9cbad7ef51b17e49aeaa3e7b0d029b36ca1e9c3b2a9b78823

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Cache the Arm GNU Toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: ~/arm-gnu-toolchain
          key: arm-gnu-toolchain-14.2.rel1-x86_64

      - name: Download and verify the toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o toolchain.tar.xz "$TOOLCHAIN_URL"
          echo "$TOOLCHAIN_SHA256  toolchain.tar.xz" | sha256sum -c -
          mkdir -p ~/arm-gnu-toolchain
          tar -xf toolchain.tar.xz -C ~/arm-gnu-toolchain --strip-components=1

      - name: Put the toolchain on PATH
        run: echo "$HOME/arm-gnu-toolchain/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          arm-none-eabi-gcc --version | head -n 1
          python --version

      - name: Install the package with the emulator extra
        run: python -m pip install -e ".[emu]"

      - name: Fail if toolchain-dependent tests would be skipped
        run: python -c "import unicorn, mcu_ruleout.toolchain as t; print(t.find_toolchain().version())"

      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v

      - name: Check the dataset
        run: python -m mcu_ruleout dataset data
