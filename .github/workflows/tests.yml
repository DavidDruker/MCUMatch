name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch replaces the run that is still going.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # The oldest and the newest supported Python on the other two systems.
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.14" }
          # macos-latest is Apple silicon. (The macos-14 label is no longer offered.)
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.14" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: ./.github/actions/arm-toolchain

      - name: Install the package with the emulator extra
        run: python -m pip install -e ".[emu]"

      - name: Fail if toolchain-dependent tests would be skipped
        run: python -c "import unicorn, mcu_ruleout.toolchain as t; print(t.find_toolchain().version())"

      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v 2>&1 | tee test.log

      - name: Put the failures on the run's summary
        if: failure()
        run: python .github/scripts/annotate_failures.py test.log

      - name: Check the dataset
        run: python -m mcu_ruleout dataset data

      - name: Dry run of the validation runner on made-up rows
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: python validation/dry_run_v2.py

  cmsis-dsp:
    # docs/CMSIS_DSP.md, run for real. CMSIS-DSP and the CMSIS Core headers are checked out at
    # pinned commits for this job only. Nothing from them is copied into this repository.
    name: CMSIS-DSP recipe
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check out CMSIS-DSP v1.18.0
        uses: actions/checkout@v4
        with:
          repository: ARM-software/CMSIS-DSP
          ref: 4b6f26593e9d3b24a9bc93b3646a3a859238eae2
          path: third_party/CMSIS-DSP

      - name: Check out CMSIS_6 v6.4.0 (for the Core headers)
        uses: actions/checkout@v4
        with:
          repository: ARM-software/CMSIS_6
          ref: af1b110e46a1720349f6f125e386e126767699bd
          path: third_party/CMSIS_6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ./.github/actions/arm-toolchain

      - name: Install the package with the emulator extra
        run: python -m pip install -e ".[emu]"

      - name: Run the recipe's tests, and fail if any of them is skipped
        env:
          CMSIS_DSP_PATH: ${{ github.workspace }}/third_party/CMSIS-DSP
          CMSIS_CORE_INCLUDE: ${{ github.workspace }}/third_party/CMSIS_6/CMSIS/Core/Include
        run: |
          set -o pipefail
          python -m unittest tests.test_cmsis_dsp -v 2>&1 | tee cmsis-test.log
          if grep -q "skipped" cmsis-test.log; then
            echo "::error title=CMSIS-DSP recipe::a test was skipped, so the recipe was not verified"
            exit 1
          fi

      - name: Put the failures on the run's summary
        if: failure()
        run: python .github/scripts/annotate_failures.py cmsis-test.log

      - name: The shortlist from the document, for the record
        env:
          DSP: ${{ github.workspace }}/third_party/CMSIS-DSP
          CORE: ${{ github.workspace }}/third_party/CMSIS_6/CMSIS/Core/Include
        run: |
          python -m mcu_ruleout shortlist kernels/cmsis/bench_arm_fir_f32.c \
            "$DSP/Source/FilteringFunctions/arm_fir_f32.c" "$DSP/Source/FilteringFunctions/arm_fir_init_f32.c" \
            -I "$DSP/Include" -I "$DSP/PrivateInclude" -I "$CORE" -D ARM_MATH_LOOPUNROLL --cflags "-O3" \
            --entry bench_arm_fir_f32 --measure fir_block --deadline 100us || test $? -eq 3

  container:
    # The Dockerfile at the top of the repository: the pinned toolchain plus this checkout.
    name: reproducibility container builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image (its last step runs `mcu-ruleout doctor`)
        run: docker build -t mcu-ruleout .

      - name: Run a check and the validation dry run inside it
        run: |
          docker run --rm mcu-ruleout shortlist --example fir_q15 --deadline 100us --max-load 70
          docker run --rm --entrypoint python mcu-ruleout validation/dry_run_v2.py

  package:
    name: build the package and use it from a clean install
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ./.github/actions/arm-toolchain

      - name: Build the sdist and the wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install the wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install "$(ls dist/*.whl)[emu]"

      # Run from another folder, so nothing can be picked up from the checkout by accident.
      - name: The installed tool has its targets, cycle tables, examples and web page
        working-directory: ${{ runner.temp }}
        run: |
          clean="$RUNNER_TEMP/clean/bin"
          "$clean/python" - <<'PY'
          from importlib import resources
          import mcu_ruleout
          from mcu_ruleout.cycles import CycleModel
          from mcu_ruleout.examples import all_examples
          from mcu_ruleout.targets import SUPPORTED_CORES, builtin_target_paths

          root = resources.files("mcu_ruleout")
          assert "site-packages" in str(root), f"not the installed copy: {root}"
          assert len(builtin_target_paths()) >= 11, "target specs are missing from the wheel"
          assert len(all_examples()) >= 6, "examples are missing from the wheel"
          for core in SUPPORTED_CORES:
              CycleModel(core)  # reads the cycle table
          assert root.joinpath("ui_assets", "index.html").is_file(), "the web page is missing from the wheel"
          assert root.joinpath("data", "kernel.ld").is_file(), "the link script is missing from the wheel"
          print("package data ok:", mcu_ruleout.__version__)
          PY
          "$clean/mcu-ruleout" doctor
          "$clean/mcu-ruleout" targets
          "$clean/mcu-ruleout" shortlist --example fir_q15 --deadline 100us --max-load 70 --share shared.json
          "$clean/mcu-ruleout" new my_kernel
          "$clean/mcu-ruleout" shortlist my_kernel.c --entry bench_my_kernel --measure my_kernel --deadline 100us
